name: Release Containers to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Literal `release-` prefix, not `${{ github.workflow }}` — inside a
  # called (reusable) workflow, `github.workflow` resolves to the CALLER's
  # name, so if this used that expression its group string here
  # ("Release Containers to GHCR-refs/heads/main") would be byte-identical
  # to the group `verify` inherits when it calls test.yml, causing GitHub
  # to cancel one of the two and leaving `needs: [verify]` unsatisfied
  # downstream. A literal prefix guarantees this group never collides with
  # anything test.yml (which declares no concurrency of its own) resolves to.
  group: release-${{ github.ref }}
  # NOT cancel-in-progress here (unlike pr.yml): this workflow pushes git
  # tags (bump-version) and multi-arch container images (build-and-push). A
  # cancelled mid-push run could leave a tag published without matching
  # images, or a partially-pushed image manifest. A superseded run is left
  # to finish rather than risk that inconsistent state; a new push to main
  # simply queues behind it.
  cancel-in-progress: false

jobs:
  # Runs the same lint + typecheck + test suite as test.yml, via a reusable
  # workflow call, instead of duplicating it here. The duplicate copy used
  # to drift from test.yml (it still had the now-removed `services: db:`
  # block/port-5433 race after test.yml's sibling task fixed it) — reusing
  # the single definition makes that class of drift impossible.
  verify:
    uses: ./.github/workflows/test.yml

  bump-version:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          initial_version: 0.0.1

  build-and-push:
    needs: [verify, bump-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion, mcp-server]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize repository owner to lowercase
        id: normalize
        run: |
          REPO_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=${REPO_LOWER}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LOWER }}/self-docs-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.bump-version.outputs.new_tag }}
            type=raw,value=${{ needs.bump-version.outputs.new_version }}
            type=sha,format=long

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EMBEDDING_MODEL_NAME=mixedbread-ai/mxbai-embed-large-v1
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/self-docs-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/self-docs-${{ matrix.service }}:buildcache,mode=max
          provenance: true
          sbom: true
