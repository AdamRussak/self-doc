name: Test

on:
  workflow_call:

# No concurrency block here on purpose. Inside a called (reusable) workflow,
# `${{ github.workflow }}` resolves to the CALLER's workflow name, not this
# file's — so a group keyed on it would collide with the caller's own
# concurrency group (e.g. release.yml's `release-${{ github.ref }}` if this
# used the same pattern) and GitHub would cancel one of the two runs
# sharing that group, breaking `needs: [verify]` gating downstream. Entry
# points (pr.yml, release.yml) own concurrency; this reusable workflow must
# not declare its own. See:
# https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint (ruff)
        run: make lint
      - name: Type-check (mypy)
        run: make typecheck

  test:
    runs-on: ubuntu-latest  # or: self-hosted

    # No `services: db:` block here. `make test` (via its `test-db-up`
    # dependency) is the sole Postgres provisioner in CI: it brings up the
    # isolated `db-test` compose service bound to 127.0.0.1:5433, waits for
    # it to report healthy, and lets Postgres apply ALL of db/init/*.sql
    # (01_schema, 02_sources_config, 03_fix_embedding_dim,
    # 04_upload_sources) via the container's docker-entrypoint-initdb.d
    # mount — strictly more faithful than hand-applying two of those files
    # here. A second provisioner binding the same host port races this one
    # and fails with "address already in use"; don't reintroduce one.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Configure embedding model (small/fast for CI)
        run: |
          # Use the small 384-dim model in CI so the suite doesn't download the
          # 1.2GB production default (mxbai-large) on every run. This also
          # exercises `make configure`: it writes EMBEDDING_* into .env (which
          # the Makefile exports to the test venvs) and re-renders 01_schema.sql
          # to vector(384) so the seeded test vectors match the column width.
          # Must run before `make test` — db-test reads 01_schema.sql at
          # first boot via docker-entrypoint-initdb.d.
          python -m pip install --quiet pyyaml
          make configure MODEL=BAAI/bge-small-en-v1.5

      - name: Pre-download embedding model weights for CI
        run: |
          python -m pip install --quiet fastembed
          python -c "from fastembed import TextEmbedding; TextEmbedding(model_name='BAAI/bge-small-en-v1.5')"

      - name: Run tests
        run: make test
