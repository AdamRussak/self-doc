# promtool unit tests for ops/alerts/ingestion.yml.
#
# Scope: exercises the rules that don't depend on wall-clock `time()`
# (NoSyncMetricsAtAll, SourceIndexedNothing, SourceSyncDegraded) plus
# SoftFailRatioHigh, using a 30m sample interval so the 30h windows fit in 60
# steps. SourceSyncStale is NOT covered here: its `time() -
# sync_last_success_timestamp` expression depends on promtool's internal test
# clock epoch in a way that's brittle to hand-encode reliably in this format
# (already covered directly by `promtool check rules`, which parses and
# validates every rule's PromQL).
#
# SourceSyncDegraded (T24): now a direct instant-vector check
# (`sync_last_status{status="partial"} == 1`), no offset/window arithmetic
# needed, so it's covered here like any other non-time()-dependent rule.
rule_files:
  - ingestion.yml

evaluation_interval: 30m

tests:
  # --- NoSyncMetricsAtAll -------------------------------------------------
  - interval: 30m
    input_series: []
    alert_rule_test:
      - eval_time: 4h30m
        alertname: NoSyncMetricsAtAll
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 'No pages_fetched_total series at all — /metrics is emitting zero application samples.'
              description: >-
                The ingestion service's /metrics endpoint has had no
                pages_fetched_total sample for over 4h (longer than one full sync
                cycle). This is the exact "metrics silently emit nothing" bug the
                ingestion alert suite exists to catch — every other alert in this
                file is blind while this fires.
              runbook: 'docs/runbook.md#alert-nosyncmetricsatall'

  # --- SourceIndexedNothing: a run completed but indexed zero pages ------
  - interval: 30m
    input_series:
      # sync_duration_seconds_count jumps from 0 to 1 early in the window
      # (and stays there) — one completed sync in the 30h window, held true
      # long enough to satisfy `for: 10m`.
      - series: 'sync_duration_seconds_count{source="traefik"}'
        values: '0+0x9 1+0x50'
      - series: 'pages_fetched_total{source="traefik"}'
        values: '0x60'
      - series: 'pages_skipped_unchanged_total{source="traefik"}'
        values: '0x60'
      - series: 'pages_not_modified_total{source="traefik"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 29h30m
        alertname: SourceIndexedNothing
        exp_alerts:
          - exp_labels:
              source: traefik
              severity: critical
            exp_annotations:
              summary: 'Source "traefik" completed a sync but indexed zero pages.'
              description: >-
                traefik: a sync run finished in the last 30h window
                with pages_fetched + pages_skipped_unchanged + pages_not_modified
                == 0. This is the "reports ok but indexed nothing" failure mode —
                check the source's sitemap/include_prefixes.
              runbook: 'docs/runbook.md#alert-sourceindexednothing'

  # --- SourceSyncDegraded: sync_last_status reports "partial" -------------
  - interval: 30m
    input_series:
      # A source whose most recently completed sync reported "partial" —
      # only the "partial" status series is present (the current
      # `record_sync_outcome` behavior: the other two status label values
      # for this source are removed, not left at 0).
      - series: 'sync_last_status{source="traefik", status="partial"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: SourceSyncDegraded
        exp_alerts:
          - exp_labels:
              source: traefik
              status: partial
              severity: warning
            exp_annotations:
              summary: 'Source "traefik" reported status=partial on its last completed sync.'
              description: >-
                traefik: the most recently completed sync reported status
                "partial" (a hard pipeline failure, an aborted crawl, a
                refused purge, or an elevated soft-failure ratio — see
                `classify_sync` in app/store.py). Check `GET /status` for this
                source to see which condition applied.
              runbook: 'docs/runbook.md#alert-sourcesyncdegraded'

  # --- SourceSyncDegraded: does NOT fire for status="ok" -------------------
  - interval: 30m
    input_series:
      - series: 'sync_last_status{source="fastapi", status="ok"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: SourceSyncDegraded
        exp_alerts: []

  # --- SourceSyncDegraded: stale-series regression guard -------------------
  # A source that reported "partial" for its first 30 samples and then
  # transitions to "ok" (its "partial" series is REMOVED, not zeroed, from
  # sample 31 onward — matching record_sync_outcome's `.remove(...)` call)
  # must stop matching this alert once the "ok" series takes over. Modeled
  # here as two disjoint series over the same window, since PromQL unit
  # tests can't literally delete a label combination mid-series; an absent
  # sample from a given timestamp onward is the correct proxy for "removed".
  - interval: 30m
    input_series:
      - series: 'sync_last_status{source="docker-compose", status="partial"}'
        values: '1x30 _x30'
      - series: 'sync_last_status{source="docker-compose", status="ok"}'
        values: '_x30 1x30'
    alert_rule_test:
      - eval_time: 14h30m
        alertname: SourceSyncDegraded
        exp_alerts:
          - exp_labels:
              source: docker-compose
              status: partial
              severity: warning
            exp_annotations:
              summary: 'Source "docker-compose" reported status=partial on its last completed sync.'
              description: >-
                docker-compose: the most recently completed sync reported status
                "partial" (a hard pipeline failure, an aborted crawl, a
                refused purge, or an elevated soft-failure ratio — see
                `classify_sync` in app/store.py). Check `GET /status` for this
                source to see which condition applied.
              runbook: 'docs/runbook.md#alert-sourcesyncdegraded'
      - eval_time: 29h30m
        alertname: SourceSyncDegraded
        exp_alerts: []

  # --- SoftFailRatioHigh: 117/280 soft-failed (41.8%), the traefik case --
  - interval: 30m
    input_series:
      - series: 'pages_fetched_total{source="traefik"}'
        values: '0+0x9 163+0x50'
      - series: 'pages_skipped_unchanged_total{source="traefik"}'
        values: '0x60'
      - series: 'pages_not_modified_total{source="traefik"}'
        values: '0x60'
      - series: 'pages_soft_failed_total{source="traefik"}'
        values: '0+0x9 117+0x50'
    alert_rule_test:
      - eval_time: 29h30m
        alertname: SoftFailRatioHigh
        exp_alerts:
          - exp_labels:
              source: traefik
              severity: warning
            exp_annotations:
              summary: 'Source "traefik" soft-failed over 20% of its pages in the last run.'
              description: >-
                traefik: 41.79% of pages in
                the last ~30h were soft-failed (dead links / stub content). Still
                reports "ok" by design, but this share is high enough to warrant a
                look — check for a moved/renamed sitemap or a bulk link rot event.
              runbook: 'docs/runbook.md#alert-softfailratiohigh'
