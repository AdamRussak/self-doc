# Prometheus alerting rules for the `ingestion` service.
#
# Source of these metrics: `ingestion/app/metrics.py` / `record_sync_outcome`,
# called once per *completed* sync (any status — ok, partial, or failed) via
# `store.sync_source_with_metrics`, the single choke point every sync
# entrypoint (main.py's `POST /sync`, admin.py's manual-sync routes, the
# scheduler) routes through:
#
#   pages_fetched_total{source}            (Counter)
#   pages_skipped_unchanged_total{source}  (Counter)
#   pages_not_modified_total{source}       (Counter)
#   pages_soft_failed_total{source}        (Counter)
#   pages_failed_total{source}             (Counter — hard pipeline failures;
#                                            drives status=partial/failed)
#   pages_shell_suspected_total{source}    (Counter — T6's cross-page JS-shell
#                                            detector count; a subset of
#                                            pages_soft_failed_total. Added by
#                                            T28 so a source silently losing
#                                            content to client-side rendering
#                                            is visible on its own, not only
#                                            folded into the generic soft-fail
#                                            ratio)
#   chunks_indexed_total{source}           (Counter)
#   sync_duration_seconds{source}          (Histogram — _count increases once
#                                            per completed sync regardless of
#                                            status, so `increase(..._count)`
#                                            is this file's "a sync attempt
#                                            finished in this window" signal)
#   sync_last_success_timestamp{source}    (Gauge — set to now() on status
#                                            "ok" AND "partial"; left UNTOUCHED
#                                            on "failed")
#   sync_last_status{source, status}       (Gauge — 1 for the status
#                                            ("ok"/"partial"/"failed") of the
#                                            source's most recently completed
#                                            sync; the other two status label
#                                            values for that source are
#                                            removed by `record_sync_outcome`,
#                                            so exactly one series per source
#                                            reads 1 at any given time — see
#                                            `metrics.py`'s module docstring)
#
# T24 CLOSED THE PRIOR METRICS GAP: `SourceSyncDegraded` used to have no
# direct way to assert "this source reported partial" and relied on a
# run-over-run page-volume-collapse proxy instead (see git history for that
# version). `sync_last_status` now makes the direct check possible —
# `sync_last_status{status="partial"} == 1` — and `SourceSyncDegraded` below
# uses it instead of the proxy.
#
# Cadence assumption used throughout: syncs run ~daily and take ~3.5h
# end-to-end for the full source set (see docs/runbook.md "Expected sync
# durations"). Every "did a run happen / how much did it do" window below
# uses 30h (24h cadence + ~6h slack for schedule jitter and the ~3.5h
# per-source run length) so a rule evaluates the most recently completed
# run without double-counting into the next one and without flapping
# between evaluations.
groups:
  - name: self-docs-ingestion
    rules:
      # ----------------------------------------------------------------
      # SourceSyncStale
      #
      # `time() - sync_last_success_timestamp` is an instant-vector
      # expression: it only ever evaluates over series that already
      # exist. A source whose gauge has NEVER been set (no completed
      # "ok"/"partial" sync since the series was created — e.g. every
      # attempt so far has hard-failed) simply has no
      # `sync_last_success_timestamp{source="x"}` series to subtract
      # against, so it is silently excluded from this expression's
      # result set — it reads as ABSENT, not as a (bogus, arbitrarily
      # large) "stale" value. That is intentional and is a DIFFERENT
      # failure mode than staleness: per-label absence can't be alerted
      # on directly here without an enumerated source list (which this
      # file deliberately avoids — sources are added/removed at
      # runtime), and in practice a source with zero-ever successful
      # syncs is caught by other signals instead (SourceIndexedNothing
      # once it does complete a run with zero pages, or plain absence
      # of the source from `GET /status` for anyone actually watching
      # a brand-new source's first sync). Do not "fix" this rule to
      # also catch never-set series by using an `or vector(9e9)`-style
      # trick — that would conflate two distinct failures into one
      # alert name and muddy triage.
      #
      # Threshold: 48h. One missed daily sync is not yet an incident
      # (could be a single scheduler hiccup); two is. 48h also comfortably
      # exceeds the ~3.5h run length so a sync that's merely running long
      # never trips this.
      - alert: SourceSyncStale
        expr: time() - max by (source) (sync_last_success_timestamp) > 172800
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'Source "{{ $labels.source }}" has not completed a successful (ok/partial) sync in over 48h.'
          description: >-
            {{ $labels.source }}: last successful sync was {{ $value | humanizeDuration }} ago.
            Check the scheduler and `GET /status` for this source.
          runbook: 'docs/runbook.md#alert-sourcesyncstale'

      # ----------------------------------------------------------------
      # SourceSyncDegraded
      #
      # DIRECT SIGNAL (no longer a proxy — see T24 in the file-level
      # comment above): `sync_last_status{source, status="partial"} == 1`
      # is the literal, current-state assertion "this source's most
      # recently completed sync reported status=partial" -- `classify_sync`
      # sets `partial` for a purge-guard refusal, an early-aborted crawl,
      # any hard pipeline failure (`pages_failed > 0`), or a soft-failure
      # ratio above `SOFT_FAIL_PARTIAL_RATIO` (see `app/store.py`'s
      # `classify_sync` docstring for the exact rule order). No run-over-run
      # volume comparison or offset windowing is needed: the gauge already
      # IS "the current status," and `record_sync_outcome` guarantees at
      # most one status series per source is active at a time (stale
      # values from a prior status are removed — see `metrics.py`).
      #
      # `for: 15m` still applies so a single evaluation right at the
      # instant a gauge flips (mid-scrape-interval jitter) doesn't page
      # before the next scrape confirms it's holding.
      - alert: SourceSyncDegraded
        expr: sync_last_status{status="partial"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Source "{{ $labels.source }}" reported status=partial on its last completed sync.'
          description: >-
            {{ $labels.source }}: the most recently completed sync reported
            status "partial" (a hard pipeline failure, an aborted crawl, a
            refused purge, or an elevated soft-failure ratio — see
            `classify_sync` in app/store.py). Check `GET /status` for this
            source to see which condition applied.
          runbook: 'docs/runbook.md#alert-sourcesyncdegraded'

      # ----------------------------------------------------------------
      # SourceIndexedNothing
      #
      # The exact "reports ok but indexes nothing" trap (see docs/runbook.md
      # Troubleshooting: dead/moved sitemap -> BFS fallback -> own
      # include_prefixes filters out base_url -> zero pages, but
      # last_status is still "ok" because pages_failed == 0). Requires
      # BOTH: a sync attempt actually finished in the window
      # (`sync_duration_seconds_count` increased — otherwise a source that
      # simply hasn't run yet this window would falsely match "zero
      # everything", which is SourceSyncStale's job, not this one) AND the
      # three "something happened to a page" counters summed to zero.
      - alert: SourceIndexedNothing
        expr: |-
          increase(sync_duration_seconds_count[30h]) > 0
          and
          (increase(pages_fetched_total[30h]) + increase(pages_skipped_unchanged_total[30h]) + increase(pages_not_modified_total[30h])) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: 'Source "{{ $labels.source }}" completed a sync but indexed zero pages.'
          description: >-
            {{ $labels.source }}: a sync run finished in the last 30h window
            with pages_fetched + pages_skipped_unchanged + pages_not_modified
            == 0. This is the "reports ok but indexed nothing" failure mode —
            check the source's sitemap/include_prefixes.
          runbook: 'docs/runbook.md#alert-sourceindexednothing'

      # ----------------------------------------------------------------
      # SoftFailRatioHigh
      #
      # The traefik case: 117 of 280 pages soft-failed (41.8%) while the
      # source still reported "ok" (soft failures don't degrade status
      # by design — see docs/runbook.md's classification section — but a
      # large, silent share of a source's content going soft-failed is
      # still worth a human's attention, hence a dedicated alert rather
      # than relying on `last_status`). 20% is chosen as comfortably below
      # the 41.8% traefik incident (would have caught it) while staying
      # well above the low single-digit soft-fail rates expected from
      # ordinary dead links/stub pages on a healthy source.
      #
      # `clamp_min(..., 1)` guards divide-by-zero for a source with no
      # activity in the window (0/1 == 0, well under the 0.2 threshold,
      # so no false positive); the explicit `> 20` on the denominator
      # additionally guards against a single-digit-volume source where
      # one soft-failed page out of a handful would otherwise look like
      # a huge ratio on statistically meaningless volume.
      - alert: SoftFailRatioHigh
        expr: |-
          (
            increase(pages_soft_failed_total[30h])
            /
            clamp_min(increase(pages_fetched_total[30h]) + increase(pages_skipped_unchanged_total[30h]) + increase(pages_not_modified_total[30h]) + increase(pages_soft_failed_total[30h]), 1)
          ) > 0.20
          and
          (increase(pages_fetched_total[30h]) + increase(pages_skipped_unchanged_total[30h]) + increase(pages_not_modified_total[30h]) + increase(pages_soft_failed_total[30h])) > 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Source "{{ $labels.source }}" soft-failed over 20% of its pages in the last run.'
          description: >-
            {{ $labels.source }}: {{ $value | humanizePercentage }} of pages in
            the last ~30h were soft-failed (dead links / stub content). Still
            reports "ok" by design, but this share is high enough to warrant a
            look — check for a moved/renamed sitemap or a bulk link rot event.
          runbook: 'docs/runbook.md#alert-softfailratiohigh'

      # ----------------------------------------------------------------
      # ShellSuspectedRatioHigh
      #
      # Complements SoftFailRatioHigh above with a JS-shell-SPECIFIC signal:
      # a source can be losing a large share of its content to client-side
      # rendering (T6's cross-page JS-shell detector,
      # `pages_shell_suspected_total`) while its overall soft-fail ratio
      # still looks like ordinary site friction (dead links, stub pages) --
      # `pages_shell_suspected_total` is a SUBSET of
      # `pages_soft_failed_total`, so a source could sit comfortably under
      # SoftFailRatioHigh's 20% threshold on total soft-fails while still
      # having most of THAT slice be undetected JS shells, or (for a source
      # with `js_render` off) simply never recovering them at all. This is
      # exactly the traefik incident this whole alert suite exists to catch
      # (117 of 280 pages, 41.8%, silently client-side-rendered) made
      # visible on its own axis rather than folded into the generic
      # soft-fail bucket.
      #
      # Same shape as SoftFailRatioHigh: 20% of total page volume, `> 20`
      # total-page floor to avoid alerting on statistically meaningless
      # ratios from tiny sources, `clamp_min(..., 1)` divide-by-zero guard.
      - alert: ShellSuspectedRatioHigh
        expr: |-
          (
            increase(pages_shell_suspected_total[30h])
            /
            clamp_min(increase(pages_fetched_total[30h]) + increase(pages_skipped_unchanged_total[30h]) + increase(pages_not_modified_total[30h]) + increase(pages_soft_failed_total[30h]), 1)
          ) > 0.20
          and
          (increase(pages_fetched_total[30h]) + increase(pages_skipped_unchanged_total[30h]) + increase(pages_not_modified_total[30h]) + increase(pages_soft_failed_total[30h])) > 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Source "{{ $labels.source }}" is losing over 20% of its pages to suspected JS-shell content in the last run.'
          description: >-
            {{ $labels.source }}: {{ $value | humanizePercentage }} of pages in
            the last ~30h were flagged as suspected JS-shell stubs (T6's
            cross-page detector) — client-side-rendered content the crawler
            cannot see without headless rendering. Check `GET /status` for
            `shell_suspected_count`/`pages_js_rendered` on this source, and
            consider opting it into `js_render` (see
            docs/runbook.md#headless-render-retry-t7) if it isn't already.
          runbook: 'docs/runbook.md#alert-shellsuspectedratiohigh'

      # ----------------------------------------------------------------
      # NoSyncMetricsAtAll — meta-alert, high severity
      #
      # Regression guard for the exact bug this whole alerting program
      # exists to close: `/metrics` previously emitted zero application
      # samples because the counters were only incremented from a route
      # handler no real sync went through. If `pages_fetched_total`
      # (or, by construction, any of its siblings, since they're all
      # incremented together in `record_sync_outcome`) is entirely
      # absent, every other rule in this file is silently blind — none of
      # them can fire on missing data, so this is the one rule standing
      # between "the whole alerting story went dark" and "we noticed."
      #
      # `for: 4h` (> the ~3.5h full sync-set duration) so a normal
      # container restart — where the metric family is legitimately
      # absent until the first sync completes and recreates it — does not
      # page. Anything absent for longer than one full sync cycle's
      # worth of time is a real regression, not a restart window.
      - alert: NoSyncMetricsAtAll
        expr: absent(pages_fetched_total)
        for: 4h
        labels:
          severity: critical
        annotations:
          summary: 'No pages_fetched_total series at all — /metrics is emitting zero application samples.'
          description: >-
            The ingestion service's /metrics endpoint has had no
            pages_fetched_total sample for over 4h (longer than one full sync
            cycle). This is the exact "metrics silently emit nothing" bug the
            ingestion alert suite exists to catch — every other alert in this
            file is blind while this fires.
          runbook: 'docs/runbook.md#alert-nosyncmetricsatall'
